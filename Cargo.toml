[package]
name = "mdq"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "A local-first search and retrieval CLI for Markdown collections"
license = "MIT"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
chrono-english = "0.1.8"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
fastembed = { version = "5.16", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
hex = "0.4"
percent-encoding = "2.3"
pest = "2.8"
pest_derive = "2.8"
pulldown-cmark = "0.13"
regex = "1.11"
rquickjs = "0.12"
rquickjs-serde = "0.6"
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
schemars = { version = "1.2.1", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
walkdir = "2.5"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
hf-hub = { version = "0.5", default-features = false }
ndarray = "0.17"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["coreml"] }

[dev-dependencies]
tempfile = "3.20"
